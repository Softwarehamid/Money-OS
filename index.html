<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10151f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MoneyOS" />
    <title>MoneyOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="authGate" class="auth-gate">
      <div class="auth-card">
        <div class="brand auth-brand">
          <div class="brand-mark">M</div>
          <div>
            <p>MoneyOS</p>
            <span>Cloud Login</span>
          </div>
        </div>
        <h1>Sign in to MoneyOS</h1>
        <p class="muted auth-copy">
          Use email and password to sync your MoneyOS data. Sign in from any
          phone or browser to view the same info anywhere.
        </p>

        <form id="authForm" class="auth-form">
          <label>
            Email
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input
              id="authPassword"
              type="password"
              autocomplete="current-password"
              minlength="6"
              required
            />
          </label>
          <div class="auth-actions">
            <button class="secondary-button" id="authSignUpBtn" type="button">
              Create account
            </button>
            <button class="primary-button" id="authSignInBtn" type="submit">
              Sign in
            </button>
          </div>
          <p id="authStatus" class="auth-status muted"></p>
        </form>
      </div>
    </section>

    <div class="app-shell hidden" id="appShell">
      <aside class="sidebar" id="sidebar" aria-label="MoneyOS navigation">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <p>MoneyOS</p>
            <span>Command Center</span>
          </div>
        </div>

        <nav class="nav-tabs" id="navTabs"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayLabel"></p>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <button
              class="secondary-button menu-toggle"
              id="menuToggleBtn"
              type="button"
              aria-expanded="false"
              aria-controls="sidebar"
              aria-label="Open navigation menu"
            >
              Menu
            </button>
            <button class="primary-button" id="quickAddBtn" type="button">
              Add Item
            </button>
            <button class="secondary-button" id="signOutBtn" type="button">
              Sign out
            </button>
          </div>
        </header>

        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="entryDialog">
      <form method="dialog" class="dialog-card" id="entryForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">MoneyOS entry</p>
            <h2 id="dialogTitle">Add Item</h2>
          </div>
          <button
            class="icon-button"
            data-close-dialog
            aria-label="Close"
            type="button"
          >
            ×
          </button>
        </div>

        <label>
          Type
            <select id="entryType" name="entryType">
              <option value="paycheck">Paycheck</option>
              <option value="mobileJob">Mobile Mechanic Job</option>
              <option value="bill">Bill</option>
              <option value="debt">Debt</option>
              <option value="user">User</option>
              <option value="budget">Budget Category</option>
              <option value="saving">Savings Goal</option>
              <option value="expense">Expense</option>
          </select>
        </label>

        <div id="formFields" class="form-grid"></div>

        <div class="dialog-actions">
          <button
            class="danger-button hidden"
            id="deleteEntryBtn"
            type="button"
          >
            Delete
          </button>
          <button class="secondary-button" data-close-dialog type="button">
            Cancel
          </button>
          <button
            class="primary-button"
            id="saveEntryBtn"
            value="default"
            type="submit"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
